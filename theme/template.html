<script>
// Fit A4 sheets to narrow screens (phones). Pure layout; no state stored.
(function(){
  function fit(){
    var w = document.documentElement.clientWidth, pw = 210*96/25.4 + 16;
    var z = Math.min(1, w / pw);
    document.querySelectorAll('.page').forEach(function(p){ p.style.zoom = z < 1 ? z : ''; });
  }
  window.addEventListener('resize', fit); fit();
})();
</script>
